<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>한글 마스터 대모험</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Jua&display=swap');
        
        body { margin: 0; padding: 0; background-color: #2c3e50; font-family: 'Jua', sans-serif; touch-action: manipulation; overflow: hidden; }
        
        #game-container { max-width: 800px; height: 100vh; margin: 0 auto; background-color: #ecf0f1; position: relative; overflow-y: auto; overflow-x: hidden; }
        .screen { display: none; min-height: 100vh; flex-direction: column; align-items: center; justify-content: center; padding: 40px 20px; text-align: center; box-sizing: border-box; }
        .screen.active { display: flex; }
        h1 { color: #2c3e50; font-size: 38px; margin-bottom: 20px; word-break: keep-all; }
        
        button { font-family: 'Jua', sans-serif; font-size: 24px; padding: 15px 30px; margin: 10px; border: none; border-radius: 15px; background-color: #3498db; color: white; cursor: pointer; box-shadow: 0 5px 0 #2980b9; transition: transform 0.1s; }
        button:active { transform: translateY(5px); box-shadow: none; }
        .btn-back { background-color: #95a5a6; box-shadow: 0 5px 0 #7f8c8d; margin-bottom: 20px; font-size: 20px; padding: 10px 20px; }
        button.speaker-btn { background-color: #f1c40f; box-shadow: 0 5px 0 #f39c12; font-size: 30px; border-radius: 50%; width: 70px; height: 70px; padding: 0; margin-bottom: 20px;}
        
        #btn-attack { background-color: #e74c3c; box-shadow: 0 8px 0 #c0392b; font-size: 40px; padding: 20px 50px; border-radius: 20px; margin-top: 30px; touch-action: none; user-select: none; -webkit-user-select: none; }
        #btn-attack:active { transform: translateY(8px); box-shadow: 0 0 0 #c0392b; }

        .char-box, .dungeon-box, .category-box, .pet-box { background: white; border: 4px solid #bdc3c7; border-radius: 20px; padding: 20px; margin: 10px; cursor: pointer; display: inline-block; width: 220px; }
        .category-box { font-size: 60px; padding: 40px 20px; width: 250px; }
        .dungeon-box { font-size: 50px; position: relative; } /* 완료 도장 배치를 위한 relative */
        
        /* 순차적 던전 클리어 스타일 */
        .dungeon-locked { filter: grayscale(100%); opacity: 0.5; pointer-events: none; }
        .dungeon-cleared { filter: grayscale(100%); opacity: 0.8; pointer-events: none; border-color: #95a5a6; }
        .stamp { position: absolute; top: 10px; right: 10px; color: #e74c3c; border: 4px solid #e74c3c; border-radius: 10px; padding: 5px 10px; font-size: 20px; font-weight: bold; transform: rotate(-15deg); background: rgba(255,255,255,0.9); z-index: 10;}

        /* 펫 도감 스타일 */
        .pet-box { width: 100px; height: 100px; padding: 10px; position: relative; }
        .pet-box img { width: 100%; height: 100%; object-fit: contain; }
        .pet-locked { filter: grayscale(100%) brightness(0.3); pointer-events: none; }
        .pet-equipped { border-color: #f1c40f; background-color: #fff9c4; box-shadow: 0 0 15px #f1c40f; }

        /* 상단 항상 고정 UI */
        #hearts-display { position: fixed; top: 15px; right: 20px; font-size: 30px; z-index: 50; }
        #btn-reset-hearts { position: fixed; top: 15px; left: 15px; z-index: 50; font-size: 16px; padding: 10px 15px; background-color: #e74c3c; box-shadow: 0 4px 0 #c0392b; margin: 0; display: none; }
        
        #quiz-image { margin: 10px 0; max-width: 100%; position: relative; }
        #quiz-image img { max-width: 100%; max-height: 22vh; object-fit: contain; }
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; width: 100%; max-width: 500px; margin-top: 20px; }
        .option-btn { background-color: #1abc9c; box-shadow: 0 5px 0 #16a085; font-size: 30px; padding: 15px; transition: all 0.2s; }
        .option-btn.disabled { background-color: #95a5a6 !important; box-shadow: 0 5px 0 #7f8c8d !important; pointer-events: none; opacity: 0.8; }
        
        .battle-stage { display: flex; justify-content: space-between; align-items: flex-end; width: 100%; height: 280px; padding: 20px 40px; box-sizing: border-box; margin-top: 20px;}
        .fighter { position: relative; text-align: center; }
        .fighter img.character-body { width: 130px; height: 130px; object-fit: contain; z-index: 2; position: relative; }
        
        .equipped-weapon { position: absolute; z-index: 3; object-fit: contain; transform-origin: bottom left; }
        .equipped-pet { position: absolute; width: 60px; height: 60px; object-fit: contain; z-index: 4; }
        .monster-body { width: 140px; height: 140px; object-fit: contain; z-index: 2; position: relative; transition: all 0.1s; }
        
        /* 펫 둥둥 및 합동 공격, 점프, 구출 애니메이션 */
        @keyframes floatPet { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
        @keyframes petAttack { 0% { transform: translateX(0) scale(1); } 50% { transform: translateX(40px) scale(1.2); } 100% { transform: translateX(0) scale(1); } }
        @keyframes happyJump { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-30px); } }
        @keyframes flyToPlayer { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(-230px, 0px) scale(1.2); } }
        
        .anim-pet-attack { animation: petAttack 0.25s ease !important; }
        .anim-happy-jump { animation: happyJump 0.5s ease-in-out infinite !important; }
        .anim-fly-to-player { animation: flyToPlayer 1s ease-in-out forwards; }

        .hp-container { width: 120px; height: 20px; background-color: #bdc3c7; border-radius: 10px; margin: 0 auto 10px auto; overflow: hidden; border: 3px solid white; box-shadow: 0 3px 6px rgba(0,0,0,0.2); }
        .hp-bar { width: 100%; height: 100%; background-color: #e74c3c; transition: width 0.1s linear; }

        .aura-blue { filter: drop-shadow(0 0 15px #3498db); }
        .aura-yellow { filter: drop-shadow(0 0 15px #f1c40f); }
        .aura-red { filter: drop-shadow(0 0 15px #e74c3c); }
        .aura-green { filter: drop-shadow(0 0 15px #2ecc71); }
        .aura-purple { filter: drop-shadow(0 0 15px #9b59b6); }
        
        @keyframes rushRight { 0% { transform: translateX(0); } 50% { transform: translateX(60px); } 100% { transform: translateX(0); } }
        @keyframes swingWeapon { 0% { transform: rotate(0deg); } 40% { transform: rotate(90deg); } 100% { transform: rotate(0deg); } }
        @keyframes monsterHurt { 0% { filter: brightness(1); transform: translateX(0); } 30% { filter: brightness(2) sepia(1) hue-rotate(-50deg); transform: translateX(15px); } 100% { filter: brightness(1); transform: translateX(0); } }
        @keyframes monsterDie { to { opacity: 0; transform: scale(0.1) rotate(180deg); } }
        
        .anim-rush-right { animation: rushRight 0.25s ease; }
        .anim-swing { animation: swingWeapon 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .anim-hurt { animation: monsterHurt 0.25s ease; }
        .anim-die { animation: monsterDie 0.8s forwards; }

        .hit-effect { position: absolute; top: 30px; left: 20px; width: 100px; height: 100px; opacity: 0; pointer-events: none; z-index: 5; }
        @keyframes flashEffect { 0% { opacity: 1; transform: scale(0.5); } 100% { opacity: 0; transform: scale(1.5); } }
        .effect-slash { background: linear-gradient(135deg, transparent 40%, white 50%, transparent 60%); animation: flashEffect 0.2s ease-out; }
        .effect-magic { background: radial-gradient(circle, #f1c40f 0%, transparent 70%); animation: flashEffect 0.25s ease-out; }
        .effect-fire { background: radial-gradient(circle, #e74c3c 0%, #f39c12 50%, transparent 80%); animation: flashEffect 0.2s ease-out; }

        #feedback-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: none; align-items: center; justify-content: center; z-index: 100; text-align: center; }
        .think-again-msg { font-size: 50px; color: white; text-shadow: 0 4px 10px rgba(0,0,0,0.5); line-height: 1.4; }
        
        @keyframes goldenPop {
            0% { transform: scale(0.5); opacity: 0; text-shadow: 0 0 0px #f39c12; }
            50% { transform: scale(1.3); opacity: 1; text-shadow: 0 0 20px #f39c12, 0 0 40px #f1c40f; }
            100% { transform: scale(1.1); opacity: 1; text-shadow: 0 0 30px #f39c12, 0 0 50px #f1c40f; }
        }
        .golden-text { font-size: 120px; font-weight: bold; color: #fff200; animation: goldenPop 1.5s ease-out forwards; }

        /* 중상단에서 쏟아지는 파티클 */
        .confetti { position: fixed; width: 15px; height: 15px; z-index: 9999; opacity: 0; pointer-events: none; }
        @keyframes confettiFall {
            0% { transform: translateY(0vh) rotate(0deg); opacity: 1; }
            80% { opacity: 1; }
            100% { transform: translateY(80vh) rotate(720deg); opacity: 0; }
        }

        .slot-name { font-size: 80px; font-weight: bold; color: #e74c3c; background: white; padding: 20px 50px; border-radius: 20px; border: 5px solid #c0392b; display: inline-block; min-width: 200px;}

        @media (max-width: 500px) {
            h1 { font-size: 28px; margin-bottom: 10px; }
            .option-btn { font-size: 22px; padding: 12px; }
            .char-box, .category-box { padding: 15px; width: 140px; }
            .dungeon-box { width: 120px; font-size: 40px; padding: 15px 5px; }
            .stamp { font-size: 16px; padding: 3px 5px; top: 5px; right: 5px; }
            .category-box { font-size: 40px; padding: 20px 10px; width: 160px; }
            #btn-attack { font-size: 32px; padding: 15px 40px; }
            .battle-stage { padding: 20px; height: 230px;}
            .golden-text { font-size: 80px; }
            .think-again-msg { font-size: 35px; }
            .pet-box { width: 70px; height: 70px; }
            #hearts-display { font-size: 24px; top: 10px; right: 10px; }
            #btn-reset-hearts { font-size: 14px; padding: 8px 10px; top: 10px; left: 10px; }
        }
    </style>
</head>
<body>

<!-- HTML <audio> 태그 복구 (안드로이드 호환성 핵심) -->
<audio id="bgm-map" src="bgm_map.mp3" loop preload="auto"></audio>
<audio id="bgm-battle" src="bgm_battle.mp3" loop preload="auto"></audio>

<div id="game-container">
    <div id="feedback-overlay"><div id="feedback-icon"></div></div>
    
    <!-- 항상 떠있는 상단 UI -->
    <button id="btn-reset-hearts" onclick="resetHearts()">하트 충전 ↻</button>
    <div id="hearts-display" style="display:none;">❤️❤️❤️❤️❤️</div>

    <!-- 0. 시작 화면 -->
    <div id="screen-start" class="screen active">
        <h1 style="font-size: 50px;">한글 마스터 대모험</h1>
        <button onclick="initGame()" style="font-size: 30px; padding: 20px 50px; margin-top: 40px; animation: floatPet 2s infinite;">터치해서 시작하기!</button>
    </div>

    <!-- 1. 순서 정하기 -->
    <div id="screen-turn" class="screen">
        <h1>누가 먼저 모험을 떠날까요?</h1>
        <div class="slot-name" id="slot-name-display">???</div><br>
        <button onclick="startTurnSlot()" style="font-size: 30px; padding: 20px 40px; margin-top: 30px;">순서 뽑기!</button>
    </div>

    <!-- 2. 캐릭터 선택 -->
    <div id="screen-char-select" class="screen">
        <h1 id="char-select-title">모험을 떠날 캐릭터를 고르세요!</h1>
        <div>
            <div class="char-box" onclick="selectChar('warrior.png', '연우')">
                <img src="warrior.png" style="width: 120px; height: 120px; object-fit: contain;" alt="전사" onerror="this.outerHTML='<div style=\'font-size:80px;\'>👦</div>'"><br>
                <span style="font-size:26px;">용감한 전사</span>
            </div>
            <div class="char-box" onclick="selectChar('princess.png', '연아')">
                <img src="princess.png" style="width: 120px; height: 120px; object-fit: contain;" alt="공주" onerror="this.outerHTML='<div style=\'font-size:80px;\'>👧</div>'"><br>
                <span style="font-size:26px;">멋진 공주</span>
            </div>
        </div>
    </div>

    <!-- 3. 모험 지역 선택 -->
    <div id="screen-category" class="screen">
        <h1>어느 지역으로 갈까요?</h1>
        <div>
            <div class="category-box" onclick="showMap('normal')">
                🗺️<br><span style="font-size:26px;">일반 던전</span>
            </div>
            <div class="category-box" onclick="showMap('hangeul')">
                📚<br><span style="font-size:26px;">한글나라 던전</span>
            </div>
        </div>
        <button style="background-color:#9b59b6; box-shadow: 0 5px 0 #8e44ad; margin-top:30px;" onclick="showCollection()">📖 내 도감(펫) 보기</button>
    </div>

    <!-- 4. 세부 던전 선택 -->
    <div id="screen-map" class="screen">
        <button class="btn-back" onclick="showScreen('screen-category')">⬅️ 지역 바꾸기</button>
        <h1 id="map-title">던전을 선택하세요!</h1>
        <!-- 던전이 순차적으로 배치될 공간 -->
        <div id="dungeon-list"></div>
    </div>

    <!-- 5. 도감 (펫) 화면 -->
    <div id="screen-collection" class="screen">
        <button class="btn-back" onclick="showScreen('screen-category')">⬅️ 뒤로가기</button>
        <h1>나만의 펫 도감</h1>
        
        <div id="pet-preview" style="height: 150px; width: 150px; position: relative; margin-bottom: 20px; display: flex; justify-content: center; align-items: center;"></div>

        <h3 style="color:#7f8c8d; margin-top:0;">던전을 깰 때마다 펫이 모여요! (최대 3마리)</h3>
        <div id="pet-list" style="max-width: 600px;"></div>
        
        <button onclick="resetPets()" style="font-size: 16px; padding: 10px; background-color: #95a5a6; margin-top: 30px;">펫 도감 초기화 (테스트용)</button>
    </div>

    <!-- 6. 퀴즈 화면 -->
    <div id="screen-quiz" class="screen">
        <h2 id="quiz-progress" style="color:#7f8c8d; margin-top:0;">문제 1 / 3</h2>
        <div id="quiz-image"></div> 
        <button class="speaker-btn" onclick="speakQuestion()">🔊</button>
        <h1 id="quiz-text" style="margin-bottom: 0;">이 그림은 무엇일까요?</h1>
        <div class="options-grid" id="quiz-options"></div>
    </div>

    <!-- 7. 아이템 획득 -->
    <div id="screen-reward" class="screen">
        <h1>정답입니다! 무기 획득!</h1>
        <div id="reward-icon" style="margin: 20px;"></div>
        <h2>새로운 장비를 장착했어요!</h2>
        <button onclick="startBattle()">괴물 물리치러 가기!</button>
    </div>

    <!-- 8. 전투 화면 -->
    <div id="screen-battle" class="screen">
        <h1 id="battle-title">버튼을 눌러 물리치세요!</h1>
        <div class="battle-stage">
            <div class="fighter" id="battle-player"></div>
            <!-- 몬스터 영역 (크기 변동 및 잡힌 펫 표시) -->
            <div class="fighter" id="battle-monster-container"></div>
        </div>
        <button id="btn-attack" onpointerdown="hitMonster(event)">물리치기! ⚔️</button>
        <button id="btn-return-map" style="display:none;" onclick="returnToMap()">돌아가기</button>
    </div>

    <!-- 9. 수면 모드 (캐릭터 변경 버튼 추가) -->
    <div id="screen-sleep" class="screen">
        <div style="font-size: 150px;">😴💤</div>
        <h1 id="sleep-msg">오늘은 너무 피곤해요.<br>코~ 자고 내일 다시 만나요!</h1>
        <button onclick="changePlayer()" style="margin-top: 20px; font-size: 26px; padding: 15px 40px; background-color: #f39c12; box-shadow: 0 5px 0 #e67e22;">다음 친구가 고르세요!</button>
    </div>
</div>

<script>
    let playerImgSrc = '';
    let playerName = '';
    let currentCategoryKey = 'normal';
    let currentDungeonIndex = 1;
    let currentQuizIndex = 0;
    
    // 로컬 스토리지
    let heartsData = JSON.parse(localStorage.getItem('hangeulHearts')) || { 'warrior.png': 5, 'princess.png': 5 };
    let unlockedPets = parseInt(localStorage.getItem('hangeulPets')) || 0;
    let equippedPets = JSON.parse(localStorage.getItem('hangeulEquippedPets')) || [];
    let categoryProgress = JSON.parse(localStorage.getItem('hangeulProgress')) || { normal: [], hangeul: [] };

    let monsterMaxHp = 7;
    let monsterCurrentHp = 7;
    let isMonsterDead = false;
    let ttsUnlocked = false; 

    // 오디오 컨텍스트
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    const categories = {
        normal: { title: "일반 던전", dungeons: [1, 2, 3] },
        hangeul: { title: "한글나라 던전", dungeons: [4, 5, 6, 7, 8] } // 8번 동물 던전 추가
    };

    const pets = [
        { id: 'pet1.png', name: '강아지', icon: '🐶' }, { id: 'pet2.png', name: '고양이', icon: '🐱' },
        { id: 'pet3.png', name: '드래곤', icon: '🐲' }, { id: 'pet4.png', name: '병아리', icon: '🐥' },
        { id: 'pet5.png', name: '아기곰', icon: '🐻' }, { id: 'pet6.png', name: '파랑새', icon: '🐦' },
        { id: 'pet7.png', name: '거북이', icon: '🐢' }, { id: 'pet8.png', name: '유니콘', icon: '🦄' },
        { id: 'pet9.png', name: '여우', icon: '🦊' }, { id: 'pet10.png', name: '펭귄', icon: '🐧' }
    ];

    const dungeons = {
        1: {
            title: "초보", icon: "🌲", monster: 'monster1.png', item: 'item1.png', aura: 'aura-blue', effect: 'effect-slash',
            weaponStyle: 'width: 80px; height: 80px; transform: rotate(0deg) scale(1.3); right: -30px; top: 10px;',
            options: ["ㄱ", "ㄴ", "ㄷ", "ㄹ"],
            quizzes: [
                { text: "기역을 고르세요.", tts: "기역을 고르세요.", img: '<div style="font-size:120px;">❓</div>', correct: "ㄱ" },
                { text: "니은을 고르세요.", tts: "니은을 고르세요.", img: '<div style="font-size:120px;">❓</div>', correct: "ㄴ" },
                { text: "디귿을 고르세요.", tts: "디귿을 고르세요.", img: '<div style="font-size:120px;">❓</div>', correct: "ㄷ" }
            ]
        },
        2: {
            title: "기초", icon: "🌟", monster: 'monster2.png', item: 'item2.png', aura: 'aura-yellow', effect: 'effect-magic',
            weaponStyle: 'width: 80px; height: 80px; transform: rotate(15deg) scale(1.4); right: -40px; top: 10px;',
            options: ["ㅏ", "ㅑ", "ㅓ", "ㅕ"],
            quizzes: [
                { text: "아 를 고르세요.", tts: "아 를 고르세요.", img: '<div style="font-size:120px;">❓</div>', correct: "ㅏ" },
                { text: "야 를 고르세요.", tts: "야 를 고르세요.", img: '<div style="font-size:120px;">❓</div>', correct: "ㅑ" },
                { text: "어 를 고르세요.", tts: "어 를 고르세요.", img: '<div style="font-size:120px;">❓</div>', correct: "ㅓ" }
            ]
        },
        3: {
            title: "동물", icon: "🐯", monster: 'monster3.png', item: 'item3.png', aura: 'aura-red', effect: 'effect-fire',
            weaponStyle: 'width: 90px; height: 90px; transform: rotate(-45deg) scale(1.6); right: -50px; top: 40px;', 
            options: ["사자", "무플론", "사슴", "호랑이", "코끼리", "기린"],
            quizzes: [
                { text: "이 그림은 무엇일까요?", tts: "호랑이를 고르세요.", img: '<img src="tiger.png" onerror="this.outerHTML=\'<div style=font-size:120px;>🐯</div>\'">', correct: "호랑이" },
                { text: "이 그림은 무엇일까요?", tts: "사자를 고르세요.", img: '<div style="font-size:120px;">🦁</div>', correct: "사자" },
                { text: "이 그림은 무엇일까요?", tts: "코끼리를 고르세요.", img: '<div style="font-size:120px;">🐘</div>', correct: "코끼리" }
            ]
        },
        4: {
            title: "과일", icon: "🍉", monster: 'monster4.png', item: 'item4.png', aura: 'aura-green', effect: 'effect-slash',
            weaponStyle: 'width: 80px; height: 80px; transform: rotate(10deg) scale(1.3); right: -30px; top: 20px;',

    function shuffleArray(array) {
        let arr = array.slice();
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    // --- BGM 및 오디오 제어 로직 (태블릿 철통 호환성 확보) ---
    function initGame() {
        if(audioCtx.state === 'suspended') audioCtx.resume();
        
        const m = document.getElementById('bgm-map');
        const b = document.getElementById('bgm-battle');
        m.volume = 0.3; b.volume = 0.4;
        
        // 안드로이드/iOS 권한 획득을 위해 짧게 재생 후 정지
        m.play().then(() => m.pause()).catch(e=>{});
        b.play().then(() => b.pause()).catch(e=>{});
        
        if (!ttsUnlocked) {
            // 빈 소리가 아닌 실제 소리를 아주 작게 재생시켜 TTS 엔진 강제 기상
            let u = new SpeechSynthesisUtterance('모험 시작');
            u.volume = 0.05; 
            window.speechSynthesis.speak(u);
            ttsUnlocked = true;
        }
        showScreen('screen-turn');
    }

    function playBGM(type) {
        const m = document.getElementById('bgm-map');
        const b = document.getElementById('bgm-battle');
        m.pause(); b.pause();
        
        if(type === 'map') { 
            m.currentTime = 0; 
            m.play().catch(e => console.log('BGM Play Error:', e)); 
        } else if(type === 'battle') { 
            b.currentTime = 0; 
            b.play().catch(e => console.log('BGM Play Error:', e)); 
        }
    }

    function playSound(type) {
        if(audioCtx.state === 'suspended') audioCtx.resume();
        const t = audioCtx.currentTime;
        // 효과음 신디사이저 로직 (기존과 동일)
        if (type === 'correct') {
            [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
                const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
                osc.type = 'sine'; osc.frequency.value = freq; osc.connect(gain); gain.connect(audioCtx.destination);
                gain.gain.setValueAtTime(0, t + i * 0.08); gain.gain.linearRampToValueAtTime(0.2, t + i * 0.08 + 0.02);
                gain.gain.exponentialRampToValueAtTime(0.01, t + i * 0.08 + 0.3); osc.start(t + i * 0.08); osc.stop(t + i * 0.08 + 0.3);
            });
        } else if (type === 'wrong') {
            const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
            osc.type = 'sawtooth'; osc.frequency.setValueAtTime(200, t); osc.frequency.exponentialRampToValueAtTime(100, t + 0.3);
            osc.connect(gain); gain.connect(audioCtx.destination);
            gain.gain.setValueAtTime(0.3, t); gain.gain.exponentialRampToValueAtTime(0.01, t + 0.3); osc.start(t); osc.stop(t + 0.3);
        } else if (type === 'hit_sword') {
            const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
            osc.type = 'square'; osc.frequency.setValueAtTime(800, t); osc.frequency.exponentialRampToValueAtTime(100, t + 0.1);
            osc.connect(gain); gain.connect(audioCtx.destination);
            gain.gain.setValueAtTime(0.3, t); gain.gain.exponentialRampToValueAtTime(0.01, t + 0.1); osc.start(t); osc.stop(t + 0.1);
        } else if (type === 'hit_magic') {
            const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
            osc.type = 'sine'; osc.frequency.setValueAtTime(400, t); osc.frequency.linearRampToValueAtTime(1200, t + 0.15);
            osc.connect(gain); gain.connect(audioCtx.destination);
            gain.gain.setValueAtTime(0.2, t); gain.gain.exponentialRampToValueAtTime(0.01, t + 0.15); osc.start(t); osc.stop(t + 0.15);
        } else if (type === 'hit_fire') {
            const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
            osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, t); osc.frequency.exponentialRampToValueAtTime(40, t + 0.2);
            osc.connect(gain); gain.connect(audioCtx.destination);
            gain.gain.setValueAtTime(0.4, t); gain.gain.exponentialRampToValueAtTime(0.01, t + 0.2); osc.start(t); osc.stop(t + 0.2);
        } else if (type === 'victory') {
            [440, 554.37, 659.25, 880].forEach((freq, i) => {
                const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
                osc.type = 'square'; osc.frequency.value = freq; osc.connect(gain); gain.connect(audioCtx.destination);
                const startTime = t + (i < 3 ? i * 0.15 : 0.6); const duration = i < 3 ? 0.1 : 0.6;
                gain.gain.setValueAtTime(0, startTime); gain.gain.linearRampToValueAtTime(0.15, startTime + 0.05);
                gain.gain.exponentialRampToValueAtTime(0.01, startTime + duration); osc.start(startTime); osc.stop(startTime + duration);
            });
        }
    }

    let voices = [];
    window.speechSynthesis.onvoiceschanged = () => { voices = window.speechSynthesis.getVoices(); };

    function playTTS(text) {
        window.speechSynthesis.cancel(); 
        // 딜레이를 주어 삼성 브라우저 씹힘 방지
        setTimeout(() => {
            const utterance = new SpeechSynthesisUtterance(text);
            const koVoices = voices.filter(v => v.lang.includes('ko'));
            if (koVoices.length > 0) utterance.voice = koVoices[0];
            utterance.lang = 'ko-KR'; 
            utterance.pitch = 1.2; 
            utterance.rate = 0.95; 
            window.speechSynthesis.speak(utterance);
        }, 50);
    }

    // --- 화면 및 하트 로직 ---
    function showScreen(screenId) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(screenId).classList.add('active');
        document.getElementById('game-container').scrollTop = 0;
        
        // 고정된 하트/버튼은 플레이 화면에서 노출
        const showTopUI = (screenId !== 'screen-start' && screenId !== 'screen-turn' && screenId !== 'screen-battle');
        document.getElementById('hearts-display').style.display = showTopUI ? 'block' : 'none';
        document.getElementById('btn-reset-hearts').style.display = showTopUI ? 'inline-block' : 'none';
    }

    function updateHeartsDisplay() {
        if(!playerImgSrc) return;
        const hp = heartsData[playerImgSrc];
        let heartStr = '';
        for(let i=0; i<5; i++) { heartStr += (i < hp) ? '❤️' : '🖤'; }
        document.getElementById('hearts-display').innerText = heartStr;
        
        if (hp <= 0) {
            document.getElementById('sleep-msg').innerHTML = `오늘은 ${playerName} 너무 피곤해요.<br>코~ 자고 내일 다시 만나요!`;
            showScreen('screen-sleep');
        }
    }

    function resetHearts() {
        heartsData['warrior.png'] = 5;
        heartsData['princess.png'] = 5;
        localStorage.setItem('hangeulHearts', JSON.stringify(heartsData));
        updateHeartsDisplay();
        
        if(document.getElementById('screen-sleep').classList.contains('active')) {
            showScreen('screen-char-select'); // 충전 후 선택화면 이동

    // --- 펫 로직 ---
    function togglePet(petId) {
        const idx = equippedPets.indexOf(petId);
        if (idx > -1) {
            equippedPets.splice(idx, 1);
        } else {
            if (equippedPets.length < 3) {
                equippedPets.push(petId);
            } else {
                equippedPets.shift(); 
                equippedPets.push(petId);
            }
        }
        localStorage.setItem('hangeulEquippedPets', JSON.stringify(equippedPets));
        showCollection();
    }

    function resetPets() {
        unlockedPets = 0;
        equippedPets = [];
        categoryProgress = { normal: [], hangeul: [] };
        localStorage.setItem('hangeulPets', unlockedPets);
        localStorage.setItem('hangeulEquippedPets', JSON.stringify(equippedPets));
        localStorage.setItem('hangeulProgress', JSON.stringify(categoryProgress));
        alert("도감과 진행도가 모두 초기화되었습니다!");
        showCollection();
    }

    let slotInterval;
    function startTurnSlot() {
        const display = document.getElementById('slot-name-display');
        const names = ["연아", "연우"];
        let count = 0;
        
        slotInterval = setInterval(() => {
            display.innerText = names[count % 2];
            count++;
        }, 100);

        setTimeout(() => {
            clearInterval(slotInterval);
            const winner = names[Math.floor(Math.random() * 2)];
            display.innerText = winner + " 당첨!!";
            playTTS(winner + " 먼저 모험을 떠나세요!");
            
            setTimeout(() => {
                showScreen('screen-char-select');
                if(winner === "연아") document.getElementById('char-select-title').innerText = "멋진 공주를 선택하세요!";
                else document.getElementById('char-select-title').innerText = "용감한 전사를 선택하세요!";
            }, 2500);
        }, 2000);
    }

    function selectChar(imgSrc, name) {
        playerImgSrc = imgSrc;
        playerName = name; 
        updateHeartsDisplay();
        if(heartsData[playerImgSrc] > 0) {
            showScreen('screen-category');
            playBGM('map');
        }
    }

    // 던전 맵 순차적 표시 로직
    function showMap(categoryKey) {
        currentCategoryKey = categoryKey; 
        const cat = categories[categoryKey];
        document.getElementById('map-title').innerText = cat.title;
        
        const listDiv = document.getElementById('dungeon-list');
        listDiv.innerHTML = ''; 
        
        const progressArr = categoryProgress[categoryKey];
        
        cat.dungeons.forEach((dIdx, index) => {
            const d = dungeons[dIdx];
            const btn = document.createElement('div');
            btn.className = 'dungeon-box';
            
            const isCleared = progressArr.includes(dIdx);
            const isNext = (index === progressArr.length); // 방금 클리어한 개수와 인덱스가 같으면 다음 플레이할 순서
            
            if (isCleared) {
                btn.classList.add('dungeon-cleared');
                btn.innerHTML = `${d.icon}<br><span style="font-size:24px;">${d.title}</span><div class="stamp">완료!</div>`;
                btn.onclick = () => playTTS('이미 완료한 곳이에요. 다음 던전으로 가보세요!');
            } else if (isNext) {
                btn.innerHTML = `${d.icon}<br><span style="font-size:24px;">${d.title}</span>`;
                btn.onclick = () => enterDungeon(dIdx);
            } else {
                btn.classList.add('dungeon-locked');
                btn.innerHTML = `🔒<br><span style="font-size:24px;">${d.title}</span>`;
                btn.onclick = () => playTTS('아직 잠겨있어요. 이전 던전을 깨야 해요!');
            }
            
            listDiv.appendChild(btn);
        });
        showScreen('screen-map');
    }

    function showCollection() {
        const previewDiv = document.getElementById('pet-preview');
        let html = `<img src="${playerImgSrc || 'warrior.png'}" style="width:120px; height:120px; z-index:2; position:relative;" onerror="this.outerHTML='<div style=\\'font-size:80px;\\'>👤</div>'">`;
        
        // 펫 위치: 12시, 10시, 8시 방향 재정렬
        const pos = [ 'top: -60px; left: 35px;', 'top: -10px; left: -40px;', 'top: 60px; left: -40px;' ];
        equippedPets.forEach((petId, idx) => {
            html += `<img src="${petId}" style="position:absolute; width:60px; height:60px; z-index:3; ${pos[idx]} animation: floatPet ${2 + idx*0.2}s ease-in-out infinite;" onerror="this.outerHTML='<div style=\\'position:absolute; ${pos[idx]} font-size:40px; z-index:3;\\'>🐾</div>'">`;
        });
        previewDiv.innerHTML = html;

        const petList = document.getElementById('pet-list');
        petList.innerHTML = '';
        pets.forEach((pet, index) => {
            const btn = document.createElement('div');
            const isUnlocked = index < unlockedPets;
            const isEquipped = equippedPets.includes(pet.id);
            
            btn.className = `pet-box ${isUnlocked ? '' : 'pet-locked'} ${isEquipped ? 'pet-equipped' : ''}`;
            btn.innerHTML = `<img src="${pet.id}" onerror="this.outerHTML='<div style=\\'font-size:60px;\\'>${pet.icon}</div>'">`;
            
            if (isUnlocked) {
                btn.onclick = () => {
                    togglePet(pet.id);
                    playTTS(`${pet.name} 선택!`);
                };
            }
            petList.appendChild(btn);
        });
        showScreen('screen-collection');
    }

    function enterDungeon(dungeonIdx) {
        currentDungeonIndex = dungeonIdx;
        currentQuizIndex = 0;
        loadQuiz();
        showScreen('screen-quiz');
    }

    function renderQuizOptions(optionsArray, correctText) {
        const optionsDiv = document.getElementById('quiz-options');
        optionsDiv.innerHTML = '';
        const shuffledOptions = shuffleArray(optionsArray);
        
        shuffledOptions.forEach((optText) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = optText;
            btn.onclick = () => {
                if (btn.classList.contains('disabled')) return;
                checkAnswer(optText, correctText);
            };
            optionsDiv.appendChild(btn);
        });
    }

    function loadQuiz() {
        const d = dungeons[currentDungeonIndex];
        const q = d.quizzes[currentQuizIndex];
        
        document.getElementById('quiz-progress').innerText = `문제 ${currentQuizIndex + 1} / ${d.quizzes.length}`;
        document.getElementById('quiz-image').innerHTML = q.img;
        document.getElementById('quiz-text').innerText = q.text;
        
        renderQuizOptions(d.options, q.correct);
        setTimeout(speakQuestion, 300);
    }

    function checkAnswer(selectedText, correctText) {
        const overlay = document.getElementById('feedback-overlay');
        const icon = document.getElementById('feedback-icon');
        
        if (selectedText === correctText) {
            playSound('correct');
            playTTS(`정답이에요! ${playerName} 최고!`);
            
            icon.innerHTML = `<div class="golden-text">${correctText}</div>`;
            overlay.style.display = 'flex';
            
            setTimeout(() => {
                overlay.style.display = 'none';
                currentQuizIndex++;
                if (currentQuizIndex >= dungeons[currentDungeonIndex].quizzes.length) {
                    showReward();
                } else {
                    loadQuiz();
                }
            }, 2000);
        } else {
            playSound('wrong');
            const btns = document.querySelectorAll('.option-btn');
            btns.forEach(b => b.classList.add('disabled'));

            icon.innerHTML = '<div class="think-again-msg">❌<br><br>다시 한번<br>생각해 보세요!</div>';
            overlay.style.display = 'flex';
            
            setTimeout(() => { 
                overlay.style.display = 'none'; 
                renderQuizOptions(dungeons[currentDungeonIndex].options, correctText);
            }, 2000);
        }
    }

    function showReward() {
        const d = dungeons[currentDungeonIndex];
        document.getElementById('reward-icon').innerHTML = `<img src="${d.item}" style="width:150px; height:150px; object-fit:contain;" onerror="this.outerHTML='<div style=\\'font-size:120px;\\'>🎁</div>'">`;
        showScreen('screen-reward');
    }

    // 전투 셋업
    function startBattle() {
        showScreen('screen-battle');
        playBGM('battle');
        const d = dungeons[currentDungeonIndex];
        const p = document.getElementById('battle-player');
        const mContainer = document.getElementById('battle-monster-container');
        
        monsterCurrentHp = monsterMaxHp;
        isMonsterDead = false;
        document.getElementById('battle-title').innerText = "버튼을 눌러 물리치세요!";
        document.getElementById('btn-attack').style.display = 'inline-block';
        document.getElementById('btn-return-map').style.display = 'none';
        
        // 장착 펫 (12시, 10시, 8시 위치)
        let petHtml = '';
        const pos = [ 'top: -60px; left: 35px;', 'top: -10px; left: -40px;', 'top: 60px; left: -40px;' ];
        equippedPets.forEach((petId, idx) => {
            petHtml += `<img src="${petId}" class="equipped-pet" style="${pos[idx]}" onerror="this.style.display='none'">`;
        });

        p.innerHTML = `
            <img src="${playerImgSrc}" class="character-body ${d.aura}" onerror="this.outerHTML='<div class=\\'character-body ${d.aura}\\' style=\\'font-size:100px; line-height:130px;\\'>👤</div>'">
            <img src="${d.item}" class="equipped-weapon" id="weapon-img" style="${d.weaponStyle}" onerror="this.style.display='none'">
            ${petHtml}
        `;
        
        // 보스(8번) 몬스터 사이즈 및 사슬에 묶인 펫 세팅
        let monsterSize = (currentDungeonIndex === 8) ? 'width: 200px; height: 200px; margin-bottom: -15px;' : 'width: 140px; height: 140px;';
        let trappedHtml = '';
        if (currentDungeonIndex === 8 && unlockedPets < 10) {
            let nextPet = pets[unlockedPets];
            trappedHtml = `
                <div id="trapped-pet-container" style="position: absolute; right: -50px; top: 30px; z-index: 1;">
                    <img src="${nextPet.id}" style="width: 70px; height: 70px; filter: grayscale(100%) brightness(0.6);" onerror="this.outerHTML='<div style=\\'font-size:50px; filter: grayscale(100%);\\'>${nextPet.icon}</div>'">
                    <div style="position: absolute; top: -15px; left: -15px; font-size: 40px; opacity: 0.8;">⛓️</div>
                </div>
            `;
        }

        mContainer.innerHTML = `
            <div class="hp-container"><div id="monster-hp-bar" class="hp-bar"></div></div>
            <img src="${d.monster}" class="monster-body" id="monster-img" style="${monsterSize}" onerror="this.outerHTML='<div class=\\'monster-body\\' style=\\'font-size:100px; line-height:140px;\\'>👾</div>'">
            <div id="hit-layer" class="hit-effect"></div>
            ${trappedHtml}
        `;
    }

    function hitMonster(event) {
        event.preventDefault();
        if (isMonsterDead) return;

        const p = document.getElementById('battle-player');
        const weapon = document.getElementById('weapon-img');
        const monster = document.getElementById('monster-img');
        const hitLayer = document.getElementById('hit-layer');
        const hpBar = document.getElementById('monster-hp-bar');
        const petsElements = document.querySelectorAll('.equipped-pet');
        
        monsterCurrentHp--;
        hpBar.style.width = ((monsterCurrentHp / monsterMaxHp) * 100) + "%";
        
        const d = dungeons[currentDungeonIndex];
        const soundType = d.effect === 'effect-magic' ? 'hit_magic' : (d.effect === 'effect-fire' ? 'hit_fire' : 'hit_sword');
        playSound(soundType);

        p.classList.remove('anim-rush-right');
        if(weapon) weapon.classList.remove('anim-swing');
        monster.classList.remove('anim-hurt');
        hitLayer.classList.remove(d.effect);
        petsElements.forEach(pet => pet.classList.remove('anim-pet-attack'));
        
        void p.offsetWidth; 
        
        p.classList.add('anim-rush-right');
        if(weapon) weapon.classList.add('anim-swing');
        monster.classList.add('anim-hurt');
        hitLayer.classList.add(d.effect);
        
        // 펫 합동 타격 모션
        petsElements.forEach(pet => pet.classList.add('anim-pet-attack'));

        if (monsterCurrentHp <= 0) {
            isMonsterDead = true;
            document.getElementById('btn-attack').style.display = 'none';
            document.getElementById('battle-title').innerText = "대승리!! 🎉🎉🎉";
            
            monster.classList.add('anim-die');
            playSound('victory');
            fireConfetti();
            
            // 승리 후 다같이 방방 뛰기
            p.classList.add('anim-happy-jump');
            petsElements.forEach(pet => pet.classList.add('anim-happy-jump'));
            
            // 보스 처치 시 잡혀있던 펫 구출 애니메이션 연출
            if (currentDungeonIndex === 8 && unlockedPets < 10) {
                const tContainer = document.getElementById('trapped-pet-container');
                if (tContainer) {
                    let nextPet = pets[unlockedPets];
                    tContainer.innerHTML = `<img id="freed-pet" src="${nextPet.id}" style="width: 70px; height: 70px; object-fit: contain; z-index: 99;" onerror="this.outerHTML='<div style=\\'font-size:50px;\\'>${nextPet.icon}</div>'">`;
                    const freedPet = document.getElementById('freed-pet');
                    freedPet.classList.add('anim-fly-to-player'); // 펫이 날아옴
                    
                    setTimeout(() => {
                        freedPet.classList.remove('anim-fly-to-player');
                        freedPet.style.transform = 'translate(-230px, 0px) scale(1.2)'; // 플레이어 위치 근처에 고정
                        freedPet.classList.add('anim-happy-jump'); // 구출된 펫도 같이 방방 뛰기
                    }, 1000);
                }
            }
            
            // 진행도 저장 및 펫 해금 로직
            const catKey = (currentDungeonIndex <= 3) ? 'normal' : 'hangeul';
            const requiredCnt = (catKey === 'normal') ? 3 : 5;

            if (!categoryProgress[catKey].includes(currentDungeonIndex)) {
                categoryProgress[catKey].push(currentDungeonIndex);
            }

            if (categoryProgress[catKey].length >= requiredCnt) {
                if (unlockedPets < 10) unlockedPets++;
                localStorage.setItem('hangeulPets', unlockedPets);
                playTTS(`축하해요! 구역을 모두 깨서 새로운 펫을 얻었어요!`);
                // 새로운 펫 획득 후 해당 던전 카테고리 초기화
                categoryProgress[catKey] = []; 
            } else {
                playTTS(`괴물을 물리쳤어요! ${playerName} 대단해요!`);
            }
            
            heartsData[playerImgSrc]--;
            localStorage.setItem('hangeulHearts', JSON.stringify(heartsData));
            localStorage.setItem('hangeulProgress', JSON.stringify(categoryProgress));
            
            setTimeout(() => {
                document.getElementById('btn-return-map').style.display = 'inline-block';
            }, 3000); // 연출 감상 시간 확보
        }
    }

    function returnToMap() {
        updateHeartsDisplay(); 
        if(heartsData[playerImgSrc] > 0) {
            playBGM('map');
            showMap(currentCategoryKey); // 대분류가 아닌 해당 지역 맵으로 바로 돌아감
        }
    }
</script>
